<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" width="780" height="300" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" role="img" aria-label="The two-stage path for an internationally educated pharmacist"><title>The two-stage path for an internationally educated pharmacist</title><defs><marker id="ah-334155" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="10" y="25" width="245" height="260" rx="12" fill="none" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="7 5"/><text x="22" y="43" font-size="11.5" font-weight="700" fill="#475569">Before you apply</text><rect x="270" y="25" width="225" height="260" rx="12" fill="none" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="7 5"/><text x="282" y="43" font-size="11.5" font-weight="700" fill="#475569">Stage 1 · Provisional register</text><rect x="510" y="25" width="260" height="260" rx="12" fill="none" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="7 5"/><text x="522" y="43" font-size="11.5" font-weight="700" fill="#475569">Stage 2 · Clinical register</text><rect x="25" y="50" width="215" height="60" rx="8" fill="#f1f3f6" stroke="#6b7686" stroke-width="1.6"/><text x="132.5" y="76.9" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3a4554">Pharmacists&#x27; Gateway</text><text x="132.5" y="92.2" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2a323d">Canada · CAD 390 + tax</text><rect x="25" y="125" width="215" height="60" rx="8" fill="#f1f3f6" stroke="#6b7686" stroke-width="1.6"/><text x="132.5" y="151.9" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3a4554">PEBC Document Evaluation</text><text x="132.5" y="167.2" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2a323d">CAD 715 (US: CAD 250)</text><rect x="25" y="200" width="215" height="70" rx="8" fill="#f1f3f6" stroke="#6b7686" stroke-width="1.6"/><text x="132.5" y="224.4" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3a4554">English: IELTS Academic</text><text x="132.5" y="239.7" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2a323d">R7 L7 S7 W6.5, or OET</text><text x="132.5" y="254.6" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2a323d">B B B, writing C+</text><rect x="285" y="50" width="195" height="80" rx="8" fill="#e8f1f8" stroke="#1f5f8b" stroke-width="1.6"/><text x="382.5" y="72.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#154766">PEBC Part I or II</text><text x="382.5" y="87.2" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2a323d">passed, or the DCPP</text><text x="382.5" y="102.2" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2a323d">Part I CAD 870 ·</text><text x="382.5" y="117.1" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2a323d">Part II CAD 1,950</text><rect x="285" y="145" width="195" height="55" rx="8" fill="#e8f1f8" stroke="#1f5f8b" stroke-width="1.6"/><text x="382.5" y="169.4" text-anchor="middle" font-size="12.5" font-weight="700" fill="#154766">Police check (6 months)</text><text x="382.5" y="184.7" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2a323d">ID and declaration</text><rect x="285" y="215" width="195" height="55" rx="8" fill="#e9f6ee" stroke="#2e7d4f" stroke-width="1.6"/><text x="382.5" y="239.4" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d5a37">Register: CAD 703.50</text><text x="382.5" y="254.7" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2a323d">decision ≤ 15 business days</text><rect x="525" y="50" width="115" height="70" rx="8" fill="#e8f1f8" stroke="#1f5f8b" stroke-width="1.6"/><text x="582.5" y="74.4" text-anchor="middle" font-size="12.5" font-weight="700" fill="#154766">Jurisprudence</text><text x="582.5" y="89.7" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2a323d">module and</text><text x="582.5" y="104.6" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2a323d">exam</text><rect x="650" y="50" width="110" height="70" rx="8" fill="#e8f1f8" stroke="#1f5f8b" stroke-width="1.6"/><text x="705.0" y="74.4" text-anchor="middle" font-size="12.5" font-weight="700" fill="#154766">SPT</text><text x="705.0" y="89.7" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2a323d">2 × 320+ hours</text><text x="705.0" y="104.6" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2a323d">on the register</text><rect x="525" y="130" width="115" height="70" rx="8" fill="#e8f1f8" stroke="#1f5f8b" stroke-width="1.6"/><text x="582.5" y="154.4" text-anchor="middle" font-size="12.5" font-weight="700" fill="#154766">PEBC Parts</text><text x="582.5" y="169.7" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2a323d">I and II</text><text x="582.5" y="184.6" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2a323d">(&lt; 3 years old)</text><rect x="650" y="130" width="110" height="70" rx="8" fill="#e8f1f8" stroke="#1f5f8b" stroke-width="1.6"/><text x="705.0" y="154.4" text-anchor="middle" font-size="12.5" font-weight="700" fill="#154766">DCPP</text><text x="705.0" y="169.7" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2a323d">unless both parts</text><text x="705.0" y="184.6" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2a323d">first attempt</text><rect x="525" y="210" width="235" height="60" rx="8" fill="#e9f6ee" stroke="#2e7d4f" stroke-width="1.6"/><text x="642.5" y="236.9" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d5a37">Liability insurance $2M → permit</text><text x="642.5" y="252.2" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2a323d">CAD 1,055.25 a year (to June 30)</text><path d="M 132 110 L 132 123" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#ah-334155)"/><path d="M 132 185 L 132 198" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#ah-334155)"/><path d="M 240 235 L 262 235 L 262 90 L 283 90" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#ah-334155)"/><path d="M 382 130 L 382 143" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#ah-334155)"/><path d="M 382 200 L 382 213" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#ah-334155)"/><path d="M 480 242 L 523 242" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#ah-334155)"/><path d="M 640 85 L 648 85" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#ah-334155)"/></svg>