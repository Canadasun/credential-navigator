ill="#2a323d">re-reads the page</text><text x="690.0" y="399.6" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2a323d">and updates the JSON</text><path d="M 170 205 L 195 205 L 195 106 L 218 106" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#ah-334155)"/><text x="186" y="150.0" text-anchor="end" font-size="10.5" fill="#334155" font-style="italic">pages and</text><text x="186" y="163.125" text-anchor="end" font-size="10.5" fill="#334155" font-style="italic">answers</text><path d="M 305 152 L 305 193" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#ah-334155)"/><text x="312" y="177.0" text-anchor="start" font-size="10.5" fill="#334155" font-style="italic">/api/* proxy</text><path d="M 305 305 L 305 343" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#ah-334155)"/><text x="312" y="329.0" text-anchor="start" font-size="10.5" fill="#334155" font-style="italic">read rules (SQL)</text><path d="M 492 305 L 492 343" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#ah-334155)"/><path d="M 410 380 L 392 380" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#ah-334155)"/><path d="M 690 152 L 690 198" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#ah-334155)"/><text x="683" y="172.0" text-anchor="end" font-size="10.5" fill="#334155" font-style="italic">fetch and</text><text x="683" y="185.125" text-anchor="end" font-size="10.5" fill="#334155" font-style="italic">compare</text><path d="M 690 305 L 690 343" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#ah-334155)"/><text x="683" y="320.0" text-anchor="end" font-size="10.5" fill="#334155" font-style="italic">change</text><text x="683" y="333.125" text-anchor="end" font-size="10.5" fill="#334155" font-style="italic">flagged</text><path d="M 615 380 L 595 380 L 595 250 L 577 250" fill="none" stroke="#b7791f" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah-b7791f)"/><text x="20" y="300" text-anchor="start" font-size="10.5" font-weight="700" fill="#1d5a37">Nothing about the applicant</text><text x="20" y="315" text-anchor="start" font-size="10.5" font-weight="400" fill="#1d5a37">is written to the database:</text><text x="20" y="330" text-anchor="start" font-size="10.5" font-weight="400" fill="#1d5a37">answers and uploads are used</text><text x="20" y="345" text-anchor="start" font-size="10.5" font-weight="400" fill="#1d5a37">for one request, then dropped.</text><rect x="20" y="446" width="14" height="14" rx="3" fill="#e8f1f8" stroke="#1f5f8b"/><text x="40" y="457.5" text-anchor="start" font-size="10.5" font-weight="400" fill="#475569">our services</text><rect x="170" y="446" width="14" height="14" rx="3" fill="#e9f6ee" stroke="#2e7d4f"/><text x="190" y="457.5" text-anchor="start" font-size="10.5" font-weight="400" fill="#475569">regulator data</text><rect x="320" y="446" width="14" height="14" rx="3" fill="#f1f3f6" stroke="#6b7686"/><text x="340" y="457.5" text-anchor="start" font-size="10.5" font-weight="400" fill="#475569">outside systems</text><rect x="470" y="446" width="14" height="14" rx="3" fill="#fff4dd" stroke="#b7791f"/><text x="490" y="457.5" text-anchor="start" font-size="10.5" font-weight="400" fill="#475569">human review</text></svg>