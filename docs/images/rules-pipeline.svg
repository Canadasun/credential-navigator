<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 320" width="780" height="320" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" role="img" aria-label="How regulator rules get into the system and stay current"><title>How regulator rules get into the system and stay current</title><defs><marker id="ah-334155" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="ah-6b7686" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b7686"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="10" y="40" width="120" height="92" rx="8" fill="#f1f3f6" stroke="#6b7686" stroke-width="1.6"/><text x="70.0" y="68.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3a4554">Official page</text><text x="70.0" y="83.2" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2a323d">e.g. ACP</text><text x="70.0" y="98.2" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2a323d">requirements,</text><text x="70.0" y="113.1" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2a323d">PEBC fees</text><rect x="155" y="40" width="135" height="92" rx="8" fill="#fff4dd" stroke="#b7791f" stroke-width="1.6"/><text x="222.5" y="68.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7a4f00">A person reads</text><text x="222.5" y="83.2" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2a323d">it and records the</text><text x="222.5" y="98.2" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2a323d">fact, source link</text><text x="222.5" y="113.1" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2a323d">and date</text><rect x="315" y="40" width="130" height="92" rx="8" fill="#e9f6ee" stroke="#2e7d4f" stroke-width="1.6"/><text x="380.0" y="68.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d5a37">Matrix (JSON)</text><text x="380.0" y="83.2" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2a323d">requirements, fees,</text><text x="380.0" y="98.2" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2a323d">timelines,</text><text x="380.0" y="113.1" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2a323d">open questions</text><rect x="470" y="40" width="140" height="92" rx="8" fill="#e9f6ee" stroke="#2e7d4f" stroke-width="1.6"/><text x="540.0" y="68.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d5a37">Validation</text><text x="540.0" y="83.2" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2a323d">every source and</text><text x="540.0" y="98.2" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2a323d">route must exist,</text><text x="540.0" y="113.1" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2a323d">fees dated, no dupes</text><rect x="635" y="40" width="135" height="92" rx="8" fill="#e9f6ee" stroke="#2e7d4f" stroke-width="1.6"/><text x="702.5" y="68.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d5a37">PostgreSQL</text><text x="702.5" y="83.2" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2a323d">loaded in one</text><text x="702.5" y="98.2" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2a323d">transaction; same</text><text x="702.5" y="113.1" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2a323d">file = skipped</text><path d="M 130 86 L 153 86" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#ah-334155)"/><path d="M 290 86 L 313 86" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#ah-334155)"/><path d="M 445 86 L 468 86" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#ah-334155)"/><path d="M 610 86 L 633 86" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#ah-334155)"/><rect x="155" y="190" width="135" height="80" rx="8" fill="#fff4dd" stroke="#b7791f" stroke-width="1.6"/><text x="222.5" y="219.4" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7a4f00">Flag for a person</text><text x="222.5" y="234.7" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2a323d">the run fails and</text><text x="222.5" y="249.6" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2a323d">GitHub emails</text><rect x="330" y="190" width="300" height="80" rx="8" fill="#f1f3f6" stroke="#6b7686" stroke-width="1.6"/><text x="480.0" y="211.9" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3a4554">Weekly page check (every Monday)</text><text x="480.0" y="227.2" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2a323d">re-reads all 64 cited pages, compares their</text><text x="480.0" y="242.1" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2a323d">main text with the last reviewed version;</text><text x="480.0" y="257.1" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2a323d">bot-check pages are reported as blocked</text><path d="M 330 230 L 292 230" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#ah-334155)"/><text x="311" y="182.0" text-anchor="middle" font-size="10.5" fill="#334155" font-style="italic">if changed</text><path d="M 222 190 L 222 134" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#ah-334155)"/><text x="230" y="165.0" text-anchor="start" font-size="10.5" fill="#334155" font-style="italic">re-read</text><path d="M 70 134 L 70 295 L 480 295 L 480 272" fill="none" stroke="#6b7686" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah-6b7686)"/><text x="75" y="310.0" text-anchor="start" font-size="10.5" fill="#6b7686" font-style="italic">the check reads the same pages</text><text x="645" y="205" text-anchor="start" font-size="11" font-weight="700" fill="#8a1620">Rules are never</text><text x="645" y="221" text-anchor="start" font-size="11" font-weight="700" fill="#8a1620">rewritten</text><text x="645" y="237" text-anchor="start" font-size="11" font-weight="700" fill="#8a1620">automatically.</text></svg>