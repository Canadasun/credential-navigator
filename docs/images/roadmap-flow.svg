<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 370" width="780" height="370" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" role="img" aria-label="What happens when you click Show my roadmap"><title>What happens when you click Show my roadmap</title><defs><marker id="ah-334155" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="ah-b4232f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b4232f"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="10" y="30" width="130" height="86" rx="8" fill="#f1f3f6" stroke="#6b7686" stroke-width="1.6"/><text x="75.0" y="55.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3a4554">Your answers</text><text x="75.0" y="70.2" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2a323d">every one optional;</text><text x="75.0" y="85.2" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2a323d">&quot;Not sure&quot; is</text><text x="75.0" y="100.1" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2a323d">allowed</text><rect x="165" y="30" width="140" height="86" rx="8" fill="#e8f1f8" stroke="#1f5f8b" stroke-width="1.6"/><text x="235.0" y="55.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#154766">Check the answers</text><text x="235.0" y="70.2" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2a323d">no future dates,</text><text x="235.0" y="85.2" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2a323d">scores in range,</text><text x="235.0" y="100.1" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2a323d">no test + exemption</text><rect x="330" y="30" width="135" height="86" rx="8" fill="#e8f1f8" stroke="#1f5f8b" stroke-width="1.6"/><text x="397.5" y="55.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#154766">Choose the route</text><text x="397.5" y="70.2" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2a323d">e.g. Licensee or</text><text x="397.5" y="85.2" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2a323d">Member-in-Training;</text><text x="397.5" y="100.1" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2a323d">unknown: show most</text><rect x="490" y="30" width="135" height="86" rx="8" fill="#e8f1f8" stroke="#1f5f8b" stroke-width="1.6"/><text x="557.5" y="55.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#154766">Each requirement</text><text x="557.5" y="70.2" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2a323d">compare your answer</text><text x="557.5" y="85.2" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2a323d">with the threshold</text><text x="557.5" y="100.1" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2a323d">stored in the data</text><rect x="650" y="30" width="120" height="86" rx="8" fill="#e8f1f8" stroke="#1f5f8b" stroke-width="1.6"/><text x="710.0" y="55.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#154766">Costs</text><text x="710.0" y="70.2" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2a323d">expected vs</text><text x="710.0" y="85.2" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2a323d">possible; fee in</text><text x="710.0" y="100.1" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2a323d">effect today</text><path d="M 140 73 L 163 73" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#ah-334155)"/><path d="M 305 73 L 328 73" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#ah-334155)"/><path d="M 465 73 L 488 73" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#ah-334155)"/><path d="M 625 73 L 648 73" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#ah-334155)"/><rect x="165" y="170" width="140" height="60" rx="8" fill="#fdecee" stroke="#b4232f" stroke-width="1.6"/><text x="235.0" y="196.9" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8a1620">Readable error</text><text x="235.0" y="212.2" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2a323d">nothing is built</text><path d="M 235 116 L 235 168" fill="none" stroke="#b4232f" stroke-width="1.6" marker-end="url(#ah-b4232f)"/><text x="242" y="147.0" text-anchor="start" font-size="10.5" fill="#b4232f" font-style="italic">invalid</text><rect x="450" y="170" width="320" height="120" rx="8" fill="#e9f6ee" stroke="#2e7d4f" stroke-width="1.6"/><text x="610.0" y="204.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d5a37">Your roadmap</text><text x="610.0" y="219.7" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2a323d">route · progress · next steps</text><text x="610.0" y="234.7" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2a323d">each requirement: Done / To do / To confirm /</text><text x="610.0" y="249.6" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2a323d">May apply / Not needed, with its Source link</text><text x="610.0" y="264.6" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2a323d">costs and timelines · advisory disclaimer</text><path d="M 710 116 L 710 168" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#ah-334155)"/><text x="10" y="262" text-anchor="start" font-size="11" font-weight="700" fill="#7a4f00">Unknown answers become</text><text x="10" y="278" text-anchor="start" font-size="11" font-weight="400" fill="#7a4f00">&quot;To confirm&quot; questions,</text><text x="10" y="294" text-anchor="start" font-size="11" font-weight="400" fill="#7a4f00">never guesses.</text><text x="10" y="322" text-anchor="start" font-size="11" font-weight="700" fill="#1d5a37">Answers are not stored: the</text><text x="10" y="338" text-anchor="start" font-size="11" font-weight="400" fill="#1d5a37">roadmap is built for this one</text><text x="10" y="354" text-anchor="start" font-size="11" font-weight="400" fill="#1d5a37">request and sent straight back.</text></svg>