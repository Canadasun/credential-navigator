<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" width="780" height="360" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" role="img" aria-label="How an uploaded transcript or course description is compared"><title>How an uploaded transcript or course description is compared</title><defs><marker id="ah-334155" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="ah-b4232f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b4232f"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="10" y="30" width="135" height="80" rx="8" fill="#f1f3f6" stroke="#6b7686" stroke-width="1.6"/><text x="77.5" y="59.4" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3a4554">PDF upload</text><text x="77.5" y="74.7" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2a323d">transcript or course</text><text x="77.5" y="89.6" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2a323d">descriptions, ≤ 10 MB</text><rect x="170" y="30" width="130" height="80" rx="8" fill="#e8f1f8" stroke="#1f5f8b" stroke-width="1.6"/><text x="235.0" y="66.9" text-anchor="middle" font-size="12.5" font-weight="700" fill="#154766">Text layer?</text><text x="235.0" y="82.2" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2a323d">read with pypdf</text><rect x="325" y="30" width="145" height="80" rx="8" fill="#e8f1f8" stroke="#1f5f8b" stroke-width="1.6"/><text x="397.5" y="59.4" text-anchor="middle" font-size="12.5" font-weight="700" fill="#154766">Find course lines</text><text x="397.5" y="74.7" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2a323d">code · title ·</text><text x="397.5" y="89.6" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2a323d">credits · grade</text><rect x="490" y="30" width="145" height="80" rx="8" fill="#e8f1f8" stroke="#1f5f8b" stroke-width="1.6"/><text x="562.5" y="52.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#154766">Match with APEGA</text><text x="562.5" y="67.2" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2a323d">syllabus (TF-IDF);</text><text x="562.5" y="82.2" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2a323d">compulsory first,</text><text x="562.5" y="97.1" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2a323d">each course once</text><rect x="655" y="30" width="115" height="80" rx="8" fill="#e9f6ee" stroke="#2e7d4f" stroke-width="1.6"/><text x="712.5" y="59.4" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d5a37">Gap report</text><text x="712.5" y="74.7" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2a323d">per exam group:</text><text x="712.5" y="89.6" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2a323d">covered / gap</text><path d="M 145 70 L 168 70" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#ah-334155)"/><path d="M 300 70 L 323 70" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#ah-334155)"/><text x="311" y="62.0" text-anchor="middle" font-size="10.5" fill="#334155" font-style="italic">yes</text><path d="M 470 70 L 488 70" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#ah-334155)"/><path d="M 635 70 L 653 70" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#ah-334155)"/><rect x="170" y="170" width="130" height="80" rx="8" fill="#e8f1f8" stroke="#1f5f8b" stroke-width="1.6"/><text x="235.0" y="191.9" text-anchor="middle" font-size="12.5" font-weight="700" fill="#154766">OCR</text><text x="235.0" y="207.2" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2a323d">render pages at</text><text x="235.0" y="222.1" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2a323d">300 dpi, Tesseract</text><text x="235.0" y="237.1" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2a323d">(English, French)</text><path d="M 235 110 L 235 168" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#ah-334155)"/><text x="242" y="145.0" text-anchor="start" font-size="10.5" fill="#334155" font-style="italic">scanned</text><path d="M 300 210 L 397 210 L 397 112" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#ah-334155)"/><text x="350" y="202.0" text-anchor="middle" font-size="10.5" fill="#334155" font-style="italic">text found</text><rect x="10" y="170" width="135" height="80" rx="8" fill="#fdecee" stroke="#b4232f" stroke-width="1.6"/><text x="77.5" y="191.9" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8a1620">Clear message</text><text x="77.5" y="207.2" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2a323d">not a PDF, or no</text><text x="77.5" y="222.1" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2a323d">readable text</text><text x="77.5" y="237.1" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2a323d">even with OCR</text><path d="M 170 230 L 147 230" fill="none" stroke="#b4232f" stroke-width="1.6" marker-end="url(#ah-b4232f)"/><path d="M 77 110 L 77 168" fill="none" stroke="#b4232f" stroke-width="1.6" marker-end="url(#ah-b4232f)"/><text x="84" y="145.0" text-anchor="start" font-size="10.5" fill="#b4232f" font-style="italic">not a PDF</text><rect x="430" y="170" width="340" height="80" rx="8" fill="#e9f6ee" stroke="#2e7d4f" stroke-width="1.6"/><text x="600.0" y="191.9" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d5a37">What you see</text><text x="600.0" y="207.2" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2a323d">&quot;We found 21 courses. Of 24 exam requirements,</text><text x="600.0" y="222.1" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2a323d">19 look covered and 5 may still be needed&quot;</text><text x="600.0" y="237.1" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2a323d">plus &quot;Why this match?&quot; for every pairing</text><path d="M 712 110 L 712 168" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#ah-334155)"/><rect x="10" y="285" width="760" height="55" rx="8" fill="#e9f6ee" stroke="#2e7d4f" stroke-width="1.6"/><text x="390.0" y="301.9" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d5a37">Privacy</text><text x="390.0" y="317.2" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2a323d">The file and any OCR page images may sit briefly in temporary files while being read; they are deleted</text><text x="390.0" y="332.1" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2a323d">when the request ends. Nothing is sent to an outside service, and the document is never saved.</text></svg>