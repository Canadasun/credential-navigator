<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 250" width="780" height="250" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" role="img" aria-label="Which rules apply to a computer science graduate"><title>Which rules apply to a computer science graduate</title><defs><marker id="ah-334155" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="10" y="85" width="160" height="80" rx="8" fill="#f1f3f6" stroke="#6b7686" stroke-width="1.6"/><text x="90.0" y="114.4" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3a4554">Computer science</text><text x="90.0" y="129.7" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2a323d">or IT graduate</text><text x="90.0" y="144.6" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2a323d">trained abroad</text><rect x="215" y="20" width="230" height="80" rx="8" fill="#e8f1f8" stroke="#1f5f8b" stroke-width="1.6"/><text x="330.0" y="49.4" text-anchor="middle" font-size="12.5" font-weight="700" fill="#154766">Want to be a software</text><text x="330.0" y="64.7" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2a323d">engineer or practise</text><text x="330.0" y="79.6" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2a323d">engineering?</text><rect x="215" y="150" width="230" height="80" rx="8" fill="#e8f1f8" stroke="#1f5f8b" stroke-width="1.6"/><text x="330.0" y="186.9" text-anchor="middle" font-size="12.5" font-weight="700" fill="#154766">Developer, analyst, data,</text><text x="330.0" y="202.2" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2a323d">IT or cloud work</text><rect x="490" y="20" width="280" height="80" rx="8" fill="#fdecee" stroke="#b4232f" stroke-width="1.6"/><text x="630.0" y="49.4" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8a1620">Regulated: APEGA licence</text><text x="630.0" y="64.7" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2a323d">engineering roadmap + compare courses</text><text x="630.0" y="79.6" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2a323d">with the Software Engineering syllabus</text><rect x="490" y="150" width="280" height="80" rx="8" fill="#e9f6ee" stroke="#2e7d4f" stroke-width="1.6"/><text x="630.0" y="179.4" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d5a37">Not regulated: no licence needed</text><text x="630.0" y="194.7" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2a323d">optional I.S.P. from CIPS: 4 years (foreign</text><text x="630.0" y="209.6" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2a323d">CS degree) or 8 years, 1,000 h, SFIA 3</text><path d="M 170 110 L 192 110 L 192 60 L 213 60" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#ah-334155)"/><path d="M 170 140 L 192 140 L 192 190 L 213 190" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#ah-334155)"/><path d="M 445 60 L 488 60" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#ah-334155)"/><path d="M 445 190 L 488 190" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#ah-334155)"/></svg>