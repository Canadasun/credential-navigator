# Local development: the database and the API (with local OCR).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: navigator
      POSTGRES_USER: navigator
      POSTGRES_PASSWORD: navigator-local-only
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U navigator -d navigator"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://navigator:navigator-local-only@db:5432/navigator
    ports:
      - "127.0.0.1:8010:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
